<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Admin Panel</title>
<style>
*{box-sizing:border-box}
body{font-family:system-ui,sans-serif;background:#f4f1ec;margin:0;color:#222}
.top{background:#141110;color:#fff;padding:14px 20px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px}
.top a,.top button.link{color:#e9a544;margin-left:14px;background:none;border:0;padding:0;font:inherit;cursor:pointer;text-decoration:underline;margin-top:0}
.box{max-width:900px;margin:22px auto;padding:0 16px}
.tabs{display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap}
.tabs button{padding:10px 18px;background:#fff;border-radius:8px;color:#222;border:1px solid #ddd;margin:0;font-weight:500}
.tabs button.on{background:#d18b2f;color:#fff;border-color:#d18b2f}
.card{background:#fff;border-radius:10px;padding:18px;margin-bottom:14px;border:1px solid #e5ded2}
label{display:block;font-size:.85rem;font-weight:600;margin:12px 0 4px}
input[type=text],input[type=number],input[type=password],input[type=email],textarea{width:100%;padding:10px;border:1px solid #ccc;border-radius:6px;font:inherit}
button{background:#d18b2f;color:#fff;border:0;padding:10px 20px;border-radius:6px;font-weight:600;cursor:pointer;margin-top:12px;font-size:.95rem}
button:disabled{opacity:.6;cursor:wait}
button.red{background:#b3332b}
.msg{position:sticky;top:8px;z-index:9;padding:10px 14px;border-radius:8px;margin-bottom:14px;background:#e7f5e6;border:1px solid #9bd196}
.msg.err{background:#fde8e6;border-color:#e6a19b}
.row{display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.thumb{width:80px;height:60px;object-fit:cover;border-radius:6px;background:#ddd}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.grid img{width:100%;height:110px;object-fit:cover;border-radius:8px}
details summary{cursor:pointer;color:#b8741d;font-weight:600;margin-top:10px}
.cur{font-size:.8rem;color:#777;margin-top:4px}
.cur img{height:44px;vertical-align:middle;margin-right:8px;background:#eee;border-radius:4px}
.hide{display:none}
.badge{display:inline-block;padding:2px 10px;border-radius:20px;font-size:.75rem;font-weight:700;background:#fdebc8;color:#8a5a00}
.badge.done{background:#dcf1da;color:#1f6b2a}
.dot{background:#b3332b;color:#fff;border-radius:20px;padding:0 7px;font-size:.75rem;margin-left:4px}
.tabs button.on .dot{background:#fff;color:#b3332b}
</style>
</head>
<body>

<div id="loginView" class="box hide" style="max-width:380px;margin-top:80px">
  <div class="card">
    <h2>Admin Login</h2>
    <div id="loginMsg" class="msg err hide"></div>
    <div id="demoHint" class="msg hide" style="background:#fff6df;border-color:#e9c777">
      <b>DEMO MODE</b><br>Email: <code>admin@demo.com</code><br>Password: <code>demo123</code>
    </div>
    <label>ইমেইল</label><input type="email" id="email" autocomplete="username">
    <label>পাসওয়ার্ড</label><input type="password" id="password" autocomplete="current-password">
    <button id="loginBtn">লগইন</button>
  </div>
</div>

<div id="appView" class="hide">
  <div class="top">
    <span><b id="title">🍽️ Admin</b><small id="mode" style="margin-left:10px;opacity:.85"></small></span>
    <span><a href="index.html" target="_blank">সাইট দেখুন</a><button class="link" id="logoutBtn">লগআউট</button></span>
  </div>
  <div class="box">
    <div class="tabs">
      <button data-tab="orders" class="on">অর্ডার <span id="ocount"></span></button>
      <button data-tab="dishes">খাবারের মেনু</button>
      <button data-tab="gallery">গ্যালারি</button>
      <button data-tab="blog">ব্লগ</button>
      <button data-tab="settings">সাইট সেটিংস</button>
    </div>
    <div id="demoBar" class="msg hide" style="background:#fff6df;border-color:#e9c777">DEMO MODE: এখানে যা করবেন সব শুধু এই browser এ থাকবে। আসল সাইটের জন্য <b>config.js</b> এ Supabase key বসান।</div>
    <div id="msg" class="msg hide"></div>
    <div id="content"></div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<script src="demo-db.js"></script>
<script>
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const db = DEMO ? createDemoClient() : supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
let tab = 'orders', orders = [], dishes = [], posts = [], gallery = [], settings = {}, ordersOk = true, postsOk = true;

/* ---------- ছোট helper ---------- */
function toast(text, err) {
  const m = $('msg');
  m.textContent = text; m.className = 'msg' + (err ? ' err' : '');
  clearTimeout(toast.t); toast.t = setTimeout(() => m.classList.add('hide'), 4000);
}

// ছবি ছোট করে (ফোনের বড় ছবি দ্রুত লোড হবে)
function resize(file, max = 1400) {
  return new Promise((res, rej) => {
    const img = new Image(), url = URL.createObjectURL(file);
    img.onload = () => {
      const r = Math.min(1, max / Math.max(img.width, img.height));
      const c = document.createElement('canvas');
      c.width = Math.round(img.width * r); c.height = Math.round(img.height * r);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      c.toBlob(b => { URL.revokeObjectURL(url); b ? res(b) : rej(new Error('resize failed')); }, 'image/jpeg', 0.85);
    };
    img.onerror = () => rej(new Error('ছবিটি পড়া যাচ্ছে না'));
    img.src = url;
  });
}

// ছবি আপলোড করে public URL ফেরত দেয়। raw=true হলে (logo/favicon) ছোট করে না
async function uploadImage(file, raw) {
  if (!file) return '';
  if (file.size > 8 * 1024 * 1024) throw new Error('ছবি 8MB এর বেশি বড়');
  let body = file, ext = (file.name.split('.').pop() || 'png').toLowerCase().replace(/[^a-z0-9]/g, '');
  if (!raw) { body = await resize(file); ext = 'jpg'; }
  const path = crypto.randomUUID() + '.' + ext;
  const { error } = await db.storage.from('images').upload(path, body, { contentType: body.type || file.type, cacheControl: '31536000' });
  if (error) throw error;
  return db.storage.from('images').getPublicUrl(path).data.publicUrl;
}

async function removeImage(url) {
  if (!url) return;
  const i = url.indexOf('/images/');
  if (i > -1) await db.storage.from('images').remove([decodeURIComponent(url.slice(i + 8))]);
}

// সেভ সত্যিই হয়েছে কিনা নিশ্চিত করে (permission এ আটকালে Supabase চুপচাপ 0 row ফেরত দেয়)
function ok(res) {
  if (res.error) throw res.error;
  if (!res.data || !res.data.length) throw new Error('সেভ হয়নি। লগআউট করে আবার লগইন করুন। তাতেও না হলে Supabase এ supabase-setup.sql ঠিকমতো Run হয়েছে কিনা দেখুন।');
  return res.data;
}

async function run(btn, fn) {
  btn.disabled = true;
  try { await fn(); } catch (e) {
    console.error(e);
    const m = String(e.message || e);
    toast('সমস্যা হয়েছে: ' + m + (/column|relation|posts|schema cache/i.test(m) ? ' (Supabase এ supabase-blog.sql ও supabase-v2.sql Run করুন)' : ''), true);
  }
  btn.disabled = false;
}

/* ---------- লগইন ---------- */
async function start() {
  if (DEMO) { $('demoHint').classList.remove('hide'); $('demoBar').classList.remove('hide'); }
  const { data } = await db.auth.getSession();
  data.session ? showApp() : showLogin();
}
function showLogin() { $('appView').classList.add('hide'); $('loginView').classList.remove('hide'); }
async function showApp() {
  $('loginView').classList.add('hide'); $('appView').classList.remove('hide');
  await loadAll(); render();
}
$('loginBtn').onclick = async () => {
  const { error } = await db.auth.signInWithPassword({ email: $('email').value.trim(), password: $('password').value });
  if (error) { const m = $('loginMsg'); m.textContent = 'ইমেইল বা পাসওয়ার্ড ভুল হয়েছে।'; m.classList.remove('hide'); }
  else showApp();
};
$('password').addEventListener('keydown', e => { if (e.key === 'Enter') $('loginBtn').click(); });
$('logoutBtn').onclick = async () => { await db.auth.signOut(); showLogin(); };

/* ---------- ডাটা লোড ---------- */
async function loadAll() {
  const [s, d, g, o, po] = await Promise.all([
    db.from('settings').select('*').eq('id', 1).single(),
    db.from('dishes').select('*').order('id'),
    db.from('gallery').select('*').order('id', { ascending: false }),
    db.from('orders').select('*').order('id', { ascending: false }).limit(100),
    db.from('posts').select('*').order('id', { ascending: false })
  ]);
  settings = s.data || {}; dishes = d.data || []; gallery = g.data || [];
  ordersOk = !o.error; orders = o.data || [];
  postsOk = !po.error; posts = po.data || [];
  const bad = [s, d, g].filter(x => x.error).map(x => x.error.message);
  $('mode').textContent = DEMO ? '(DEMO)' : bad.length ? '⚠️ Supabase সমস্যা' : '✅ Supabase connected';
  if (bad.length) toast('ডাটা লোড হয়নি: ' + bad[0] + ' (supabase-setup.sql Run করা হয়েছে কিনা দেখুন)', true);
  const n = orders.filter(x => x.status === 'new').length;
  $('ocount').innerHTML = n ? `<span class="dot">${n}</span>` : '';
  $('title').textContent = '🍽️ ' + (settings.name || 'Admin') + ' — Admin';
}

document.querySelectorAll('.tabs button').forEach(b => b.onclick = async () => {
  tab = b.dataset.tab;
  document.querySelectorAll('.tabs button').forEach(x => x.classList.toggle('on', x === b));
  render();
  if (tab === 'orders') { await loadAll(); if (tab === 'orders') render(); }   // নতুন অর্ডার দেখাতে আবার লোড
});

function render() {
  if (tab === 'orders') renderOrders();
  else if (tab === 'dishes') renderDishes();
  else if (tab === 'blog') renderBlog();
  else if (tab === 'gallery') renderGallery();
  else renderSettings();
}

/* ---------- অর্ডার ---------- */
function renderOrders() {
  if (!ordersOk) {
    $('content').innerHTML = '<div class="card">অর্ডারের টেবিল এখনো বানানো হয়নি। Supabase এর SQL Editor এ <b>supabase-orders.sql</b> ফাইলটা Run করুন।</div>';
    return;
  }
  const newCount = orders.filter(o => o.status === 'new').length;
  const hasOpen = 'is_open' in settings, isOpen = settings.is_open !== false;
  $('content').innerHTML = `
    ${hasOpen ? `<div class="card row" style="justify-content:space-between">
      <b>${isOpen ? '🟢 এখন খোলা আছে' : '🔴 এখন বন্ধ (সাইটে অর্ডার বন্ধ)'}</b>
      <button id="openToggle" class="${isOpen ? 'red' : ''}" style="margin:0">${isOpen ? 'বন্ধ করুন' : 'খুলুন'}</button></div>` : ''}
    <div class="card row" style="justify-content:space-between">
      <b>মোট ${orders.length}টি অর্ডার, নতুন ${newCount}টি</b>
      <button id="oRefresh" style="margin:0">রিফ্রেশ</button></div>
    ${orders.map(o => `
      <div class="card">
        <div class="row" style="justify-content:space-between">
          <span><b>#${o.id}</b> · ${new Date(o.created_at).toLocaleString('en-GB')}</span>
          <span class="badge ${o.status === 'done' ? 'done' : ''}">${o.status === 'done' ? 'সম্পন্ন' : 'নতুন'}</span>
        </div>
        <p style="margin:10px 0 4px"><b>${esc(o.name)}</b> · <a href="tel:${esc(o.phone)}">${esc(o.phone)}</a></p>
        <p style="margin:0 0 8px">📍 ${esc(o.address)}</p>
        <p style="margin:0 0 8px">${(o.items || []).map(i => `${esc(i.name)} × ${esc(i.qty)}`).join('<br>')}</p>
        ${o.note ? `<p style="margin:0 0 8px">📝 ${esc(o.note)}</p>` : ''}
        <b>মোট: ৳ ${esc(o.total)}</b>
        <div class="row">
          <button data-odone="${o.id}" data-to="${o.status === 'done' ? 'new' : 'done'}">${o.status === 'done' ? 'আবার নতুন করুন' : 'সম্পন্ন করুন'}</button>
          <button class="red" data-odel="${o.id}">মুছুন</button>
        </div>
      </div>`).join('') || '<div class="card">এখনো কোনো অর্ডার আসেনি।</div>'}`;

  $('oRefresh').onclick = e => run(e.target, async () => { await loadAll(); renderOrders(); });
  if ($('openToggle')) $('openToggle').onclick = e => run(e.target, async () => {
    ok(await db.from('settings').update({ is_open: !isOpen }).eq('id', 1).select());
    toast(isOpen ? 'রেস্টুরেন্ট বন্ধ দেখানো হচ্ছে।' : 'রেস্টুরেন্ট খোলা দেখানো হচ্ছে ✅'); await loadAll(); renderOrders();
  });
  document.querySelectorAll('[data-odone]').forEach(b => b.onclick = e => run(e.target, async () => {
    ok(await db.from('orders').update({ status: b.dataset.to }).eq('id', b.dataset.odone).select());
    await loadAll(); renderOrders();
  }));
  document.querySelectorAll('[data-odel]').forEach(b => b.onclick = e => run(e.target, async () => {
    if (!confirm('অর্ডারটি মুছে ফেলবেন?')) return;
    ok(await db.from('orders').delete().eq('id', b.dataset.odel).select());
    await loadAll(); renderOrders();
  }));
}

// প্রতি ১ মিনিটে নতুন অর্ডার আছে কিনা দেখে
setInterval(async () => {
  if (tab === 'orders' && !$('appView').classList.contains('hide')) { await loadAll(); renderOrders(); }
}, 60000);

/* ---------- খাবার ---------- */
const WEEK = [['sat', 'শনি'], ['sun', 'রবি'], ['mon', 'সোম'], ['tue', 'মঙ্গল'], ['wed', 'বুধ'], ['thu', 'বৃহঃ'], ['fri', 'শুক্র']];
function dayBoxes(id, sel) {
  const s = String(sel || '').split(',').filter(Boolean);
  return `<div id="${id}" style="display:flex;flex-wrap:wrap;gap:12px">${WEEK.map(([k, n]) =>
    `<label style="display:flex;gap:4px;align-items:center;margin:0;font-weight:500"><input type="checkbox" value="${k}" ${s.includes(k) ? 'checked' : ''}>${n}</label>`).join('')}</div>`;
}
const readDays = id => { const v = [...document.querySelectorAll(`#${id} input:checked`)].map(i => i.value); return v.length === 7 ? '' : v.join(','); };
const dayNames = str => WEEK.filter(([k]) => String(str || '').split(',').includes(k)).map(x => x[1]).join(', ');

function renderDishes() {
  const hasCols = !dishes.length || 'days' in dishes[0];
  const extra = (pre, d) => hasCols ? `
    <label>কোন কোন দিন পাওয়া যায় (কিছু না বাছলে রোজ)</label>${dayBoxes(pre + 'Days', d.days)}
    <label style="display:flex;gap:6px;align-items:center"><input type="checkbox" id="${pre}New" ${d.is_new ? 'checked' : ''}> "New" ট্যাগ দেখান</label>` : '';
  const hasCat = !dishes.length || 'category' in dishes[0];
  const cats = [...new Set(dishes.map(d => d.category).filter(Boolean))];
  const catField = (pre, d) => hasCat ? `<label>ক্যাটাগরি (যেমন Rice, Curry, Drinks; ঐচ্ছিক)</label><input type="text" id="${pre}Cat" list="catList" value="${esc(d.category)}">` : '';
  const vals = pre => ({ ...(hasCols ? { days: readDays(pre + 'Days'), is_new: $(pre + 'New').checked } : {}), ...(hasCat ? { category: $(pre + 'Cat').value.trim() } : {}) });

  $('content').innerHTML = `
    <datalist id="catList">${cats.map(c => `<option value="${esc(c)}">`).join('')}</datalist>
    ${hasCols ? '' : '<div class="msg err" style="position:static">দিন ও "New" ট্যাগ চালু করতে Supabase এ <b>supabase-blog.sql</b> Run করুন।</div>'}
    <div class="card"><h3>নতুন খাবার যোগ করুন</h3>
      <label>খাবারের নাম</label><input type="text" id="dName">
      <label>দাম (৳)</label><input type="number" id="dPrice" min="0">
      <label>ছবি (JPG/PNG/WEBP)</label><input type="file" id="dImg" accept="image/*">
      ${catField('a', {})}
      ${extra('a', {})}
      <button id="dAdd">যোগ করুন</button></div>
    ${dishes.map(d => `
      <div class="card"><div class="row">
        ${d.image ? `<img class="thumb" src="${esc(d.image)}" alt="">` : '<div class="thumb"></div>'}
        <div style="flex:1"><b>${esc(d.name)}</b> ${d.is_new ? '<span class="badge">New</span>' : ''}<br>৳ ${esc(d.price)}${d.category ? ' · ' + esc(d.category) : ''}${d.days ? ' · ' + esc(dayNames(d.days)) : ''}</div>
        <button class="red" style="margin:0" data-del="${d.id}">মুছুন</button>
      </div>
      <details><summary>এডিট করুন</summary>
        <label>নাম</label><input type="text" id="n${d.id}" value="${esc(d.name)}">
        <label>দাম (৳)</label><input type="number" id="p${d.id}" value="${esc(d.price)}" min="0">
        <label>নতুন ছবি (না দিলে আগেরটাই থাকবে)</label><input type="file" id="i${d.id}" accept="image/*">
        ${catField('e' + d.id, d)}
        ${extra('e' + d.id, d)}
        <button data-save="${d.id}">সেভ করুন</button>
      </details></div>`).join('')}`;

  $('dAdd').onclick = e => run(e.target, async () => {
    const name = $('dName').value.trim();
    if (!name) return toast('খাবারের নাম লিখুন।', true);
    const image = await uploadImage($('dImg').files[0]);
    ok(await db.from('dishes').insert({ name, price: +$('dPrice').value || 0, image, ...vals('a') }).select());
    toast('নতুন খাবার যোগ হয়েছে ✅'); await loadAll(); renderDishes();
  });
  document.querySelectorAll('[data-del]').forEach(b => b.onclick = e => run(e.target, async () => {
    if (!confirm('মুছে ফেলবেন?')) return;
    const d = dishes.find(x => x.id == b.dataset.del);
    ok(await db.from('dishes').delete().eq('id', d.id).select());
    await removeImage(d.image);
    toast('খাবার মুছে ফেলা হয়েছে।'); await loadAll(); renderDishes();
  }));
  document.querySelectorAll('[data-save]').forEach(b => b.onclick = e => run(e.target, async () => {
    const id = b.dataset.save, d = dishes.find(x => x.id == id);
    const upd = { name: $('n' + id).value.trim(), price: +$('p' + id).value || 0, ...vals('e' + id) };
    const f = $('i' + id).files[0];
    if (f) upd.image = await uploadImage(f);
    ok(await db.from('dishes').update(upd).eq('id', id).select());
    if (f) await removeImage(d.image);
    toast('খাবার আপডেট হয়েছে ✅'); await loadAll(); renderDishes();
  }));
}

/* ---------- ব্লগ ---------- */
function renderBlog() {
  if (!postsOk) {
    $('content').innerHTML = '<div class="card">ব্লগের টেবিল এখনো বানানো হয়নি। Supabase এর SQL Editor এ <b>supabase-blog.sql</b> ফাইলটা Run করুন।</div>';
    return;
  }
  $('content').innerHTML = `
    <div class="card"><h3>নতুন পোস্ট লিখুন</h3>
      <label>শিরোনাম</label><input type="text" id="bTitle">
      <label>লেখা (নতুন অনুচ্ছেদের জন্য একটা ফাঁকা লাইন দিন)</label><textarea id="bBody" rows="8"></textarea>
      <label>ছবি (ঐচ্ছিক)</label><input type="file" id="bImg" accept="image/*">
      <button id="bAdd">পোস্ট করুন</button></div>
    ${posts.map(p => `
      <div class="card"><div class="row">
        ${p.image ? `<img class="thumb" src="${esc(p.image)}" alt="">` : '<div class="thumb"></div>'}
        <div style="flex:1"><b>${esc(p.title)}</b><br><small>${new Date(p.created_at).toLocaleDateString('en-GB')}</small></div>
        <button class="red" style="margin:0" data-pdel="${p.id}">মুছুন</button>
      </div>
      <details><summary>এডিট করুন</summary>
        <label>শিরোনাম</label><input type="text" id="pt${p.id}" value="${esc(p.title)}">
        <label>লেখা</label><textarea id="pb${p.id}" rows="8">${esc(p.body)}</textarea>
        <label>নতুন ছবি (না দিলে আগেরটাই থাকবে)</label><input type="file" id="pi${p.id}" accept="image/*">
        <button data-psave="${p.id}">সেভ করুন</button>
      </details></div>`).join('') || '<div class="card">এখনো কোনো পোস্ট নেই।</div>'}`;

  $('bAdd').onclick = e => run(e.target, async () => {
    const title = $('bTitle').value.trim(), body = $('bBody').value.trim();
    if (!title || !body) return toast('শিরোনাম ও লেখা দুটোই দিন।', true);
    const image = await uploadImage($('bImg').files[0]);
    ok(await db.from('posts').insert({ title, body, image }).select());
    toast('পোস্ট প্রকাশ হয়েছে ✅'); await loadAll(); renderBlog();
  });
  document.querySelectorAll('[data-pdel]').forEach(b => b.onclick = e => run(e.target, async () => {
    if (!confirm('পোস্টটি মুছে ফেলবেন?')) return;
    const p = posts.find(x => x.id == b.dataset.pdel);
    ok(await db.from('posts').delete().eq('id', p.id).select());
    await removeImage(p.image);
    toast('পোস্ট মুছে ফেলা হয়েছে।'); await loadAll(); renderBlog();
  }));
  document.querySelectorAll('[data-psave]').forEach(b => b.onclick = e => run(e.target, async () => {
    const id = b.dataset.psave, p = posts.find(x => x.id == id);
    const upd = { title: $('pt' + id).value.trim(), body: $('pb' + id).value.trim() };
    if (!upd.title || !upd.body) return toast('শিরোনাম ও লেখা দুটোই দিন।', true);
    const f = $('pi' + id).files[0];
    if (f) upd.image = await uploadImage(f);
    ok(await db.from('posts').update(upd).eq('id', id).select());
    if (f) await removeImage(p.image);
    toast('পোস্ট আপডেট হয়েছে ✅'); await loadAll(); renderBlog();
  }));
}

/* ---------- গ্যালারি ---------- */
function renderGallery() {
  $('content').innerHTML = `
    <div class="card"><h3>গ্যালারিতে ছবি যোগ করুন</h3>
      <input type="file" id="gImg" accept="image/*" multiple>
      <button id="gAdd">আপলোড</button></div>
    <div class="card"><div class="grid">
      ${gallery.map(g => `<div><img src="${esc(g.image)}" alt="">
        <button class="red" style="width:100%;padding:6px" data-gdel="${g.id}">মুছুন</button></div>`).join('') || '<p>এখনো কোনো ছবি নেই।</p>'}
    </div></div>`;

  $('gAdd').onclick = e => run(e.target, async () => {
    const files = [...$('gImg').files];
    if (!files.length) return toast('আগে ছবি বেছে নিন।', true);
    for (const f of files) {
      const image = await uploadImage(f);
      ok(await db.from('gallery').insert({ image }).select());
    }
    toast('ছবি যোগ হয়েছে ✅'); await loadAll(); renderGallery();
  });
  document.querySelectorAll('[data-gdel]').forEach(b => b.onclick = e => run(e.target, async () => {
    if (!confirm('মুছে ফেলবেন?')) return;
    const g = gallery.find(x => x.id == b.dataset.gdel);
    ok(await db.from('gallery').delete().eq('id', g.id).select());
    await removeImage(g.image);
    toast('ছবি মুছে ফেলা হয়েছে।'); await loadAll(); renderGallery();
  }));
}

/* ---------- সাইট সেটিংস ---------- */
function renderSettings() {
  const s = settings;
  const cur = (url, label) => url ? `<div class="cur"><img src="${esc(url)}" alt="">${label} বর্তমানে আছে</div>` : '';
  $('content').innerHTML = `<div class="card">
    <label>রেস্টুরেন্টের নাম</label><input type="text" id="s_name" value="${esc(s.name)}">
    <label>লোগো (PNG বা JPG, না দিলে নাম লেখা দেখাবে)</label><input type="file" id="s_logo" accept="image/*">${cur(s.logo, 'লোগো')}
    <label>Favicon (browser tab এর ছোট আইকন, বর্গাকার ছবি ভালো)</label><input type="file" id="s_favicon" accept="image/*">${cur(s.favicon, 'Favicon')}
    <label>ট্যাগলাইন (প্রথম পাতার লেখা)</label><textarea id="s_tagline" rows="2">${esc(s.tagline)}</textarea>
    <label>প্রথম পাতার বড় ছবি (Hero)</label><input type="file" id="s_hero" accept="image/*">${cur(s.hero_image, 'ছবি')}
    <label>About শিরোনাম</label><input type="text" id="s_about_title" value="${esc(s.about_title)}">
    <label>About লেখা</label><textarea id="s_about_text" rows="4">${esc(s.about_text)}</textarea>
    <label>ফোন নম্বর</label><input type="text" id="s_phone" value="${esc(s.phone)}">
    <label>WhatsApp নম্বর (দেশের কোড সহ, যেমন 8801712345678)</label><input type="text" id="s_whatsapp" value="${esc(s.whatsapp)}">
    <label>ঠিকানা</label><input type="text" id="s_address" value="${esc(s.address)}">
    <label>খোলা থাকার সময়</label><input type="text" id="s_hours" value="${esc(s.hours)}">
    <label>Facebook লিংক</label><input type="text" id="s_facebook" value="${esc(s.facebook)}">
    <label>Instagram লিংক</label><input type="text" id="s_instagram" value="${esc(s.instagram)}">
    ${'is_open' in s ? `
    <label>ঘোষণা (সাইটের একদম উপরে দেখাবে, খালি রাখলে দেখাবে না)</label><input type="text" id="s_ann" value="${esc(s.announcement)}" placeholder="যেমন: ঈদ অফার, সব খাবারে ১০% ছাড়!">
    <label>Google Map এ খোঁজার নাম/ঠিকানা (খালি রাখলে উপরের ঠিকানাই ব্যবহার হবে)</label><input type="text" id="s_map" value="${esc(s.map_query)}" placeholder="যেমন: Afghan Restaurant Moulvibazar Sadar Sylhet">
    <label style="display:flex;gap:6px;align-items:center"><input type="checkbox" id="s_open" ${s.is_open !== false ? 'checked' : ''}> রেস্টুরেন্ট এখন খোলা আছে (বন্ধ করলে সাইটে "Closed" দেখাবে ও অর্ডার বন্ধ হবে)</label>` : '<p class="cur">ঘোষণা, Map ও খোলা/বন্ধ চালু করতে Supabase এ <b>supabase-v2.sql</b> Run করুন।</p>'}
    <button id="sSave">সেভ করুন</button></div>`;

  $('sSave').onclick = e => run(e.target, async () => {
    const upd = {};
    ['name', 'tagline', 'about_title', 'about_text', 'phone', 'whatsapp', 'address', 'hours', 'facebook', 'instagram']
      .forEach(k => upd[k] = $('s_' + k).value.trim());
    if ($('s_open')) { upd.is_open = $('s_open').checked; upd.announcement = $('s_ann').value.trim(); upd.map_query = $('s_map').value.trim(); }
    const old = [];
    for (const [field, id, raw] of [['logo', 's_logo', true], ['favicon', 's_favicon', true], ['hero_image', 's_hero', false]]) {
      const f = $(id).files[0];
      if (f) { upd[field] = await uploadImage(f, raw); old.push(settings[field]); }
    }
    ok(await db.from('settings').update(upd).eq('id', 1).select());
    for (const u of old) await removeImage(u);
    toast('সেটিংস সেভ হয়েছে ✅'); await loadAll(); renderSettings();
  });
}

start();
</script>
</body>
</html>
